name: Release

# A pushed tag v1.2.3 (or v1.2.3-beta.1) builds, signs and publishes a GitHub Release.
# Run it manually (workflow_dispatch) for a dry run: the same packages as workflow artifacts, no release.
# Pull requests that change the release process get the same dry run, without attestations.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/*.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_CACHE_PATHS: |
    **/packages.lock.json
    Directory.Packages.props

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        platform: [x64, ARM64]
    outputs:
      version: ${{ steps.version.outputs.value }}
      signed: ${{ steps.cert.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ${{ env.NUGET_CACHE_PATHS }}

      - name: Version
        id: version
        shell: pwsh
        # Only for file names; the binaries get their version from MinVer (see docs/ci.md#versioning).
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-dev.$($env:GITHUB_SHA.Substring(0, 7))" }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Release version: $version"

      - name: Restore
        run: dotnet restore Groovefin.sln -p:Platform=${{ matrix.platform }}

      - name: Package MSIX
        shell: pwsh
        run: >
          dotnet build src/Groovefin.App/Groovefin.App.csproj
          --configuration Release --no-restore
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          "-p:AppxPackageDir=${{ runner.temp }}\out\msix\\"

      - name: Publish unpackaged (self-contained)
        shell: pwsh
        # The MSIX build above leaves a resources.pri without the Windows App SDK's own resources (a
        # package gets them from the runtime package). The PRI step would reuse it as up to date, and
        # the unpackaged app then crashes looking for its theme resources, so build it from scratch.
        run: |
          Remove-Item src/Groovefin.App/obj/${{ matrix.platform }}, src/Groovefin.App/bin/${{ matrix.platform }} -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/Groovefin.App/Groovefin.App.csproj --configuration Release -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true --output "${{ runner.temp }}\out\unpackaged"

      - name: Smoke test (unpackaged)
        # Starts the exact build that gets released. ARM64 builds cannot run on the x64 runner.
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./.github/scripts/Test-AppStarts.ps1 -Path "${{ runner.temp }}\out\unpackaged\Groovefin.exe"

      - name: Collect files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'out'
          # The package folder also holds the Windows App Runtime packages it depends on (Dependencies\).
          $all = Get-ChildItem (Join-Path $out 'msix') -Recurse -Filter *.msix
          $all | ForEach-Object { Write-Output $_.FullName }
          $msix = @($all | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "Expected one app MSIX, found $($msix.Count)." }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $msix[0].FullName "dist/Groovefin_${env:VERSION}_${env:PLATFORM}.msix"
          Compress-Archive -Path (Join-Path $out 'unpackaged\*') -DestinationPath "dist/Groovefin_${env:VERSION}_${env:PLATFORM}_unpackaged.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Import signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_BASE64)) {
            Write-Output '::warning title=Unsigned packages::SIGNING_CERT_PFX_BASE64 is not set, so the MSIX packages are not signed.'
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          'available=true' >> $env:GITHUB_OUTPUT

      - name: Sign MSIX
        if: steps.cert.outputs.available == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ runner.temp }}\signing.pfx
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./.github/scripts/Sign-Package.ps1 -Path (Get-ChildItem dist -Filter *.msix).FullName

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: bundle
    needs: build
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Create bundle
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # makeappx bundles every package in a folder; the bundle version is numeric like the packages'.
          $bundleInput = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'bundle-input')
          Copy-Item packages/*.msix $bundleInput
          $numeric = ($env:VERSION -split '-')[0] + '.0'
          New-Item -ItemType Directory dist | Out-Null
          $makeappx = & ./.github/scripts/Find-WindowsSdkTool.ps1 -Name makeappx.exe
          & $makeappx bundle /bv $numeric /d $bundleInput /p "dist/Groovefin_${env:VERSION}.msixbundle" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE." }

      - name: Import signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_BASE64)) {
            Write-Output '::warning title=Unsigned bundle::SIGNING_CERT_PFX_BASE64 is not set, so the bundle is not signed.'
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          'available=true' >> $env:GITHUB_OUTPUT

      - name: Sign bundle
        if: steps.cert.outputs.available == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ runner.temp }}\signing.pfx
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./.github/scripts/Sign-Package.ps1 -Path (Get-ChildItem dist -Filter *.msixbundle).FullName

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          {
            echo '### Release files'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.msix
            dist/*.msixbundle
            dist/*.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          flags=(--verify-tag --generate-notes --title "Groovefin $VERSION")
          # Tags with a pre-release part (v1.0.0-beta.1) are pre-releases.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$SIGNED" != "true" ]]; then
            flags+=(--notes "> **Unsigned packages.** Install the MSIX with Developer Mode on (\`Add-AppxPackage -AllowUnsigned\`), or use the unpackaged ZIP.")
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

      - name: Dry run
        if: github.ref_type != 'tag'
        run: echo "Dry run (${GITHUB_REF_NAME}); no release created. The files are this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
