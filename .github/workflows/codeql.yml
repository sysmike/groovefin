name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:27 UTC.
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: analyze (csharp)
    # The WinUI project only builds on Windows, so CodeQL traces a full Windows build.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Restore
        run: dotnet restore Groovefin.sln -p:Platform=x64

      - name: Build
        run: dotnet build Groovefin.sln --configuration Release --no-restore -p:Platform=x64

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:csharp
          # Uploaded below, without the results in generated code.
          upload: never
          output: ${{ runner.temp }}/codeql

      - name: Leave out generated code
        # Source generators and the XAML compiler write code to obj\ that Groovefin cannot change (#343).
        shell: pwsh
        run: ./.github/scripts/Remove-GeneratedResults.ps1 -Path "${{ runner.temp }}\codeql"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql
          category: /language:csharp
